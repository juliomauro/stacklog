<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stacklog</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap">
<style>
  :root {
    --bg: #f5f2eb; --surface: #eae6db; --surface-2: #ded8c7; --border: #b0a888;
    --fg: #1a3a28; --fg-dim: #5a7a68; --ok: #1a5c3a; --danger: #a8324a; --glow: none;
    --cat-bg: #efebe1;
    --term-green: #1a5c3a; --term-glow: none; --term-glitch: none;
    --title-blue: #1a5c3a; --title-glow: none;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000308; --surface: #020810; --surface-2: #001540; --border: #003388;
      --fg: #00bbee; --fg-dim: #0088bb; --ok: #00b4ff; --danger: #ff3b5c;
      --glow: 0 0 10px #00b4ff66, 0 0 20px #00b4ff33;
      --cat-bg: #010916;
      --term-green: #00aa22; --term-glow: 0 0 8px #00aa22, 0 0 20px #00aa2288, 0 0 40px #00aa2244;
      --term-glitch: glitch 8s ease infinite;
      --title-blue: #00b4ff; --title-glow: 0 0 8px #00b4ff, 0 0 20px #00b4ff88, 0 0 40px #00b4ff44;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #000308; --surface: #020810; --surface-2: #001540; --border: #003388;
    --fg: #00bbee; --fg-dim: #0088bb; --ok: #00b4ff; --danger: #ff3b5c;
    --glow: 0 0 10px #00b4ff66, 0 0 20px #00b4ff33;
    --cat-bg: #010916;
    --term-green: #00aa22; --term-glow: 0 0 8px #00aa22, 0 0 20px #00aa2288, 0 0 40px #00aa2244;
    --term-glitch: glitch 8s ease infinite;
    --title-blue: #00b4ff; --title-glow: 0 0 8px #00b4ff, 0 0 20px #00b4ff88, 0 0 40px #00b4ff44;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: "Share Tech Mono", ui-monospace, monospace;
    padding: 28px clamp(16px, 3vw, 56px); display: flex; flex-direction: column; gap: 22px;
    max-width: 2560px; margin: 0 auto;
  }
  .mono { font-family: "Share Tech Mono", ui-monospace, monospace; }
  /* Title look borrowed from the hero name on oruam.cloud: Orbitron 900, strong
     glow and a brief RGB-split glitch every 8s, here in the site's terminal green
     (#00aa22). Light theme keeps it flat, like the site does. */
  h1 {
    text-wrap: balance; font-family: "Orbitron", monospace; font-size: clamp(28px, 5vw, 46px); font-weight: 900;
    margin: 0; letter-spacing: 2px; line-height: 1.1; text-transform: uppercase;
    /* main title stays in the site's default blue; categories and prompt use the green */
    --glitch-glow: var(--title-glow);
    color: var(--title-blue); text-shadow: var(--title-glow); animation: var(--term-glitch);
  }
  /* --glitch-glow is set per element, so the same glitch keeps each one's own glow color */
  @keyframes glitch {
    0%, 100% { text-shadow: var(--glitch-glow); }
    92% { text-shadow: var(--glitch-glow); }
    93% { text-shadow: -2px 0 #ff0040, 2px 0 #00ffff; transform: translateX(-2px); }
    94% { text-shadow: var(--glitch-glow); transform: translateX(0); }
    96% { text-shadow: 2px 0 #ff0040, -2px 0 #00ffff; transform: translateX(2px); }
    97% { text-shadow: var(--glitch-glow); transform: translateX(0); }
  }
  @media (prefers-reduced-motion: reduce) { h1, .category-head h2 { animation: none; } }
  .topstrip { display: flex; flex-direction: column; gap: 14px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .prompt { font-size: 0.82rem; color: var(--term-green); display: flex; align-items: baseline; gap: 6px; }
  .prompt .cursor { display: inline-block; width: 7px; height: 13px; background: var(--term-green); box-shadow: var(--term-glow); animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .prompt .cursor { animation: none; } }
  .sub { color: var(--fg-dim); font-size: 0.92rem; margin: 0; }

  .controls { display: flex; gap: 8px; }
  .theme-toggle {
    font-family: "Share Tech Mono", monospace; font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--fg-dim); background: none; border: 1px solid var(--border); border-radius: 4px;
    padding: 4px 10px; cursor: pointer; transition: all 0.2s;
  }
  .theme-toggle:hover { color: var(--ok); border-color: var(--ok); background: var(--surface-2); }

  .summarybar { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; display: flex; flex-wrap: wrap; gap: 18px; align-items: center; }
  .summarybar .big { font-family: "JetBrains Mono", monospace; font-size: 1.9rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
  .summarybar .biglabel { font-size: 0.72rem; color: var(--fg-dim); text-transform: uppercase; letter-spacing: 0.06em; }
  .summarybar .track { flex: 1 1 160px; min-width: 0; height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .summarybar .track > span { display: block; height: 100%; background: var(--ok); border-radius: 999px; transition: width 0.4s ease; }

  /* Each category is a framed box with a header band, so it reads as a group of
     projects and not as one more row of the list. */
  #categoriesRoot { display: flex; flex-direction: column; gap: 22px; }
  .category-section {
    position: relative; display: flex; flex-direction: column; gap: 12px;
    border: 1px solid var(--border); border-radius: 14px; padding: 0 16px 16px;
    background: var(--cat-bg);
  }
  .category-section.drag-over-section { outline: 2px dashed var(--ok); outline-offset: 3px; }
  .category-head {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; cursor: pointer;
    margin: 0 -16px; padding: 12px 16px; background: var(--surface-2);
    border-bottom: 1px solid var(--border); border-radius: 13px 13px 0 0;
  }
  .category-head .chevron { font-size: 0.85rem; }
  .category-section.expanded > .category-head .chevron { transform: rotate(90deg); }
  .category-head .caticon { width: 20px; height: 20px; flex: none; color: var(--term-green); }
  .category-head h2 {
    font-family: "Orbitron", monospace; font-size: 1.1rem; margin: 0; text-transform: uppercase; letter-spacing: 2px;
    color: var(--term-green); font-weight: 900; cursor: text; text-shadow: var(--term-glow); min-width: 0;
    --glitch-glow: var(--term-glow); animation: var(--term-glitch);
  }
  .category-head h2[contenteditable="true"] { outline: 1px dashed var(--fg-dim); border-radius: 4px; padding: 0 2px; }
  .category-head .catcount {
    font-family: "JetBrains Mono", monospace; font-size: 0.72rem; color: var(--fg-dim);
    border: 1px solid var(--border); border-radius: 999px; padding: 2px 9px; white-space: nowrap;
  }
  .category-section.drop-before::before, .category-section.drop-after::after {
    content: ""; position: absolute; left: 0; right: 0; height: 3px; border-radius: 3px;
    background: var(--ok); box-shadow: var(--glow);
  }
  .category-section.drop-before::before { top: -13px; }
  .category-section.drop-after::after { bottom: -13px; }
  /* While a category is being dragged, every category shows only its header so
     the list is short enough to reorder. */
  body.dragging-category .category-body, body.dragging-category .newproject { display: none; }
  .category-head .addinline {
    background: var(--surface); border: 1px solid var(--border); color: var(--fg-dim); cursor: pointer;
    font-size: 0.74rem; font-weight: 700; border-radius: 7px; padding: 5px 12px; margin-left: auto; white-space: nowrap;
  }
  .category-head .addinline:hover { border-color: var(--ok); color: var(--ok); }
  .category-head .iconbtn { opacity: 0; transition: opacity 0.15s; }
  .category-head:hover .iconbtn { opacity: 1; }

  .category-progress { display: flex; align-items: center; gap: 10px; }
  .category-progress .track { flex: 1; height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; min-width: 0; }
  .category-progress .track > span { display: block; height: 100%; border-radius: 999px; background: var(--ok); transition: width 0.4s ease; }
  .category-progress .count { font-family: "JetBrains Mono", monospace; font-size: 0.7rem; color: var(--fg-dim); font-variant-numeric: tabular-nums; white-space: nowrap; }

  .category-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .category-section.expanded .category-body { grid-template-rows: 1fr; }
  .category-body-inner {
    overflow: hidden; min-height: 0;
    opacity: 0; transform: scaleY(0.96); transform-origin: top;
    transition: opacity 0.2s ease, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .category-section.expanded .category-body-inner { opacity: 1; transform: scaleY(1); }
  @media (prefers-reduced-motion: reduce) {
    .category-body, .category-body-inner { transition: none; }
  }

  /* Fluid grid: as many columns as fit (min 320px each), so wide monitors use the
     whole width and phones drop to one column. auto-fill (not auto-fit) keeps
     empty tracks, so a category with 1-2 projects does not stretch its cards. */
  .panels { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr)); align-items: start; min-height: 12px; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; border-left: 4px solid var(--accent); }
  .panel-head { padding: 14px 18px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; border-bottom: 1px solid var(--border); background: var(--surface-2); cursor: pointer; }
  .chevron { background: none; border: none; color: var(--fg-dim); cursor: pointer; font-size: 0.8rem; padding: 2px 4px; line-height: 1; border-radius: 6px; transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .panel.expanded .chevron { transform: rotate(90deg); }
  /* touch-action: none lets a finger drag the handle instead of scrolling the page */
  .draghandle { color: var(--fg-dim); font-size: 0.95rem; cursor: grab; line-height: 1; padding: 2px 2px; user-select: none; touch-action: none; }
  .draghandle:active { cursor: grabbing; }
  .panel.dragging, .category-section.dragging { opacity: 0.35; }
  .drag-ghost {
    position: fixed; z-index: 1000; pointer-events: none; margin: 0 !important; opacity: 0.92;
    box-shadow: 0 14px 36px rgba(0, 0, 0, 0.45); transform: rotate(1.2deg);
  }
  .category-head.drag-ghost { border: 1px solid var(--border); border-radius: 13px; }
  body.is-dragging { user-select: none; -webkit-user-select: none; cursor: grabbing; }
  .panel.drag-over { outline: 2px dashed var(--accent); outline-offset: 2px; }
  .panel-head h2 { font-size: 1.05rem; margin: 0; flex: 1 1 auto; min-width: 0; cursor: text; }
  .panel-head h2[contenteditable="true"] { outline: 1px dashed var(--accent); border-radius: 4px; padding: 0 2px; }
  .chip { font-family: "JetBrains Mono", monospace; font-size: 0.68rem; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--accent); white-space: nowrap; cursor: text; }
  .chip[contenteditable="true"] { outline: 1px dashed var(--accent); }
  .iconbtn { background: none; border: none; color: var(--fg-dim); cursor: pointer; font-size: 0.95rem; padding: 2px 4px; line-height: 1; border-radius: 6px; }
  .iconbtn:hover { background: var(--border); color: var(--danger); }

  .panel-progress { padding: 10px 18px; display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .panel-progress .track { flex: 1; height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; min-width: 0; }
  .panel-progress .track > span { display: block; height: 100%; border-radius: 999px; background: var(--accent); transition: width 0.4s ease; }
  .panel-progress .count { font-family: "JetBrains Mono", monospace; font-size: 0.75rem; color: var(--fg-dim); font-variant-numeric: tabular-nums; white-space: nowrap; }

  .panel-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .panel.expanded .panel-body { grid-template-rows: 1fr; }
  .panel-body-inner {
    overflow: hidden; min-height: 0;
    opacity: 0; transform: scaleY(0.94); transform-origin: top;
    transition: opacity 0.2s ease, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .panel.expanded .panel-body-inner { opacity: 1; transform: scaleY(1); }
  @media (prefers-reduced-motion: reduce) {
    .panel-body, .panel-body-inner, .chevron { transition: none; }
  }

  ul.tasks { list-style: none; margin: 0; padding: 8px 10px 14px; display: flex; flex-direction: column; }
  .task { display: flex; align-items: flex-start; gap: 10px; padding: 9px 8px; border-radius: 8px; }
  .task:hover { background: var(--surface-2); }
  .task input[type="checkbox"] {
    appearance: none; width: 18px; height: 18px; min-width: 18px; margin-top: 1px;
    border: 1.5px solid var(--border); border-radius: 5px; cursor: pointer; position: relative; background: var(--surface);
  }
  .task input[type="checkbox"]:checked { background: var(--ok); border-color: var(--ok); }
  .task input[type="checkbox"]:checked::after {
    content: ""; position: absolute; left: 5px; top: 1px; width: 5px; height: 9px;
    border: solid var(--surface); border-width: 0 2px 2px 0; transform: rotate(40deg);
  }
  .task label { flex: 1; min-width: 0; font-size: 0.92rem; line-height: 1.4; cursor: pointer; }
  .task.done label { color: var(--fg-dim); text-decoration: line-through; text-decoration-color: var(--border); }
  .task .del { background: none; border: none; color: var(--fg-dim); cursor: pointer; font-size: 0.95rem; padding: 0 4px; line-height: 1.4; opacity: 0; transition: opacity 0.15s; }
  .task:hover .del { opacity: 1; }
  .task .del:hover { color: var(--danger); }

  .addrow { display: flex; gap: 8px; padding: 4px 18px 16px; }
  .addrow input[type="text"] { flex: 1; min-width: 0; background: var(--surface-2); border: 1px solid var(--border); border-radius: 7px; padding: 8px 10px; color: var(--fg); font-size: 0.88rem; }
  .addrow input[type="text"]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .addrow button { background: var(--accent); color: #fff; border: none; border-radius: 7px; padding: 8px 14px; font-size: 0.85rem; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .addrow button:active { transform: translateY(1px); }

  .empty { padding: 18px; color: var(--fg-dim); font-size: 0.88rem; }

  .newproject { background: var(--surface); border: 1px dashed var(--border); border-radius: 12px; padding: 16px 18px; }
  .newproject summary { cursor: pointer; font-weight: 700; font-size: 0.92rem; list-style: none; display: flex; align-items: center; gap: 6px; }
  .newproject summary::-webkit-details-marker { display: none; }
  .newproject summary::before { content: "+"; font-size: 1.1rem; }
  .newproject[open] summary::before { content: "-"; }
  .newform { display: flex; flex-direction: column; gap: 12px; }
  .newproject .newform { padding-top: 14px; }

  .addcategory {
    display: block; width: 100%; background: none; border: 1px dashed var(--border); color: var(--fg-dim);
    cursor: pointer; font-size: 0.88rem; font-weight: 700; border-radius: 10px; padding: 13px; text-align: center;
  }
  .addcategory:hover { border-color: var(--fg-dim); color: var(--fg); }
  #newCategoryHost form.newform { background: var(--surface); border: 1px dashed var(--border); border-radius: 10px; padding: 16px 18px; }
  .newform input[type="text"] { background: var(--surface-2); border: 1px solid var(--border); border-radius: 7px; padding: 9px 11px; color: var(--fg); font-size: 0.9rem; }
  .swatches { display: flex; gap: 8px; flex-wrap: wrap; }
  .swatch { width: 26px; height: 26px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
  .swatch.selected { border-color: var(--fg); }
  .newform button[type="submit"] { align-self: flex-start; background: var(--ok); color: #fff; border: none; border-radius: 7px; padding: 9px 18px; font-size: 0.88rem; font-weight: 700; cursor: pointer; }

  /* Touch screens: no hover, so controls that only appeared on hover stay
     visible, and every control gets a finger-sized (44px) target. */
  @media (pointer: coarse) {
    .draghandle, .chevron, .iconbtn, .task .del {
      min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center;
      font-size: 1.1rem;
    }
    .category-head .iconbtn, .task .del { opacity: 1; }
    .theme-toggle { min-height: 44px; padding: 0 14px; font-size: 12px; }
    .category-head .addinline, .addrow button, .addrow input[type="text"], .newform input[type="text"],
    .newform button[type="submit"], .addcategory { min-height: 44px; }
    .category-head { padding: 6px 10px; gap: 4px 6px; }
    .panel-head { padding: 6px 10px; gap: 4px 6px; }
    .task { align-items: center; padding: 2px 8px; }
    .swatch { width: 36px; height: 36px; }
  }

  footer { text-align: center; color: var(--fg-dim); font-size: 0.78rem; padding-top: 6px; }
  footer a { color: var(--fg-dim); }
</style>
</head>
<body>

<div class="topstrip">
  <div class="topbar">
    <div class="prompt mono">$ stacklog status<span class="cursor"></span></div>
    <div class="controls">
      <button type="button" class="theme-toggle" id="themeBtn"></button>
      <button type="button" class="theme-toggle" id="langBtn"></button>
    </div>
  </div>
  <h1>Stacklog</h1>
  <p class="sub" id="subtitle">status de tudo que você tá construindo.</p>
</div>

<div id="categoriesRoot"></div>

<div class="summarybar" id="summarybar">
  <div>
    <div class="big mono" id="overallCount">–</div>
    <div class="biglabel" id="overallLabel">concluídas</div>
  </div>
  <div class="track"><span id="overallTrack" style="width:0%"></span></div>
  <div class="biglabel mono" id="overallPct">–</div>
</div>

<div id="newCategoryHost">
  <button type="button" class="addcategory" id="newCategoryBtn">+ nova categoria</button>
</div>

<template id="newCategoryFormTemplate">
  <form class="newform">
    <input type="text" class="ncName" placeholder="nome da categoria (ex: pessoal, trabalho, textos)" required>
    <button type="submit">criar categoria</button>
  </form>
</template>

<template id="newProjectFormTemplate">
  <details class="newproject">
    <summary>Novo projeto</summary>
    <form class="newform">
      <input type="text" class="npName" placeholder="nome do projeto" required>
      <input type="text" class="npTag" placeholder="tag (opcional, ex: alpha, em produção)">
      <div class="swatches"></div>
      <button type="submit">criar projeto</button>
    </form>
  </details>
</template>

<footer>
  <span id="footerText">self-hosted · dados em /data/stacklog.db · </span><a href="https://github.com/juliomauro/stacklog" target="_blank" rel="noopener">github.com/juliomauro/stacklog</a>
</footer>

  function detectLang() {
    const candidates = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || "en"];
    for (const l of candidates) {
      if (/^pt/i.test(l)) return "pt";
      if (/^en/i.test(l)) return "en";
    }
    return "en";
  }
  function loadLangOverride() {
    try {
      const v = localStorage.getItem("stacklog_lang");
      return (v === "pt" || v === "en") ? v : null;
    } catch (e) { return null; }
  }
  let LANG = loadLangOverride() || detectLang();

  function t(key, vars) {
    let str = (STRINGS[LANG] && STRINGS[LANG][key]) || STRINGS.en[key] || key;
    if (vars) for (const k in vars) str = str.replace(`{${k}}`, vars[k]);
    return str;

    const override = document.documentElement.dataset.theme;

    return (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  }

    const next = currentTheme() === "dark" ? "light" : "dark";

  function toggleTheme() {
    const next = currentTheme() === "dark" ? "light" : "dark";

  // ---------- drag & drop ----------
  // Built on pointer events instead of the native HTML5 drag API, because the
  // native one does not fire for touch: this works the same with mouse, finger
  // and pen. A drag only starts after the pointer moves a few px, so a plain
  // tap on a handle does nothing.
  const DRAG_THRESHOLD = 6;
  const SCROLL_EDGE = 70; // px from the top/bottom edge where the page auto-scrolls
  let drag = null;

  function beginDrag(e, kind, id, srcEl, ghostFrom) {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    e.preventDefault();
    const rect = ghostFrom.getBoundingClientRect();
    drag = {
      kind, id, srcEl, ghostFrom,
      x: e.clientX, y: e.clientY, startX: e.clientX, startY: e.clientY,
      offX: e.clientX - rect.left, offY: e.clientY - rect.top, width: rect.width,
      started: false, ghost: null, target: null, raf: 0
    };
    window.addEventListener("pointermove", onDragMove, { passive: false });
    window.addEventListener("pointerup", onDragEnd);
    window.addEventListener("pointercancel", onDragCancel);
  }

  function onDragMove(e) {
    if (!drag) return;
    e.preventDefault();
    drag.x = e.clientX;
    drag.y = e.clientY;
    if (!drag.started) {
      if (Math.hypot(drag.x - drag.startX, drag.y - drag.startY) < DRAG_THRESHOLD) return;
      drag.started = true;
      const ghost = drag.ghostFrom.cloneNode(true);
      ghost.classList.add("drag-ghost");
      ghost.style.width = drag.width + "px";
      document.body.appendChild(ghost);
      drag.ghost = ghost;
      drag.srcEl.classList.add("dragging");
      document.body.classList.add("is-dragging");
      if (drag.kind === "category") {
        // collapse every category to its header so the whole list fits on screen
        document.body.classList.add("dragging-category");
        drag.offY = Math.min(drag.offY, drag.ghostFrom.getBoundingClientRect().height);
      }
      drag.raf = requestAnimationFrame(dragTick);
    }
    drag.ghost.style.left = (drag.x - drag.offX) + "px";
    drag.ghost.style.top = (drag.y - drag.offY) + "px";
    updateDropTarget();
  }

  function dragTick() {
    if (!drag || !drag.started) return;
    const h = window.innerHeight;
    let dy = 0;
    if (drag.y < SCROLL_EDGE) dy = -Math.ceil((SCROLL_EDGE - drag.y) / 4);
    else if (drag.y > h - SCROLL_EDGE) dy = Math.ceil((drag.y - (h - SCROLL_EDGE)) / 4);
    if (dy) { window.scrollBy(0, dy); updateDropTarget(); }
    drag.raf = requestAnimationFrame(dragTick);
  }

  function clearDropMarks() {
    document.querySelectorAll(".drag-over, .drag-over-section, .drop-before, .drop-after")
      .forEach(el => el.classList.remove("drag-over", "drag-over-section", "drop-before", "drop-after"));
  }

  function updateDropTarget() {
    clearDropMarks();
    drag.target = null;
    if (drag.kind === "project") {
      // the ghost has pointer-events: none, so this finds what is under it
      const el = document.elementFromPoint(drag.x, drag.y);
      const panel = el && el.closest(".panel");
      if (panel && panel.dataset.id && panel.dataset.id !== drag.id) {
        panel.classList.add("drag-over");
        drag.target = { panelId: panel.dataset.id };
        return;
      }
      const section = el && el.closest(".category-section");
      if (section) {
        section.classList.add("drag-over-section");
        drag.target = { categoryId: section.dataset.catId || null };
      }
      return;
    }
    // category: insert before the first other category whose middle is below the pointer
    const others = [...categoriesRoot.querySelectorAll(".category-section[data-draggable]")]
      .filter(s => s.dataset.catId !== drag.id);
    if (!others.length) return;
    const before = others.find(s => {
      const r = s.getBoundingClientRect();
      return drag.y < r.top + r.height / 2;
    });
    if (before) {
      before.classList.add("drop-before");
      drag.target = { beforeId: before.dataset.catId };
    } else {
      others[others.length - 1].classList.add("drop-after");
      drag.target = { beforeId: null };
    }
  }

  function finishDrag(apply) {
    if (!drag) return;
    const d = drag;
    drag = null;
    window.removeEventListener("pointermove", onDragMove);
    window.removeEventListener("pointerup", onDragEnd);
    window.removeEventListener("pointercancel", onDragCancel);
    cancelAnimationFrame(d.raf);
    if (d.ghost) d.ghost.remove();
    d.srcEl.classList.remove("dragging");
    document.body.classList.remove("is-dragging", "dragging-category");
    clearDropMarks();
    if (!apply || !d.started || !d.target) return;
    if (d.kind === "project") {
      if (d.target.panelId) reorderProjects(d.id, d.target.panelId);
      else moveProjectToCategory(d.id, d.target.categoryId);
    } else {
      reorderCategories(d.id, d.target.beforeId);
    }
  }
  function onDragEnd() { finishDrag(true); }
  function onDragCancel() { finishDrag(false); }

  async function reorderCategories(srcId, beforeId) {
    const src = categories.find(c => c.id === srcId);
    if (!src) return;
    const rest = categories.filter(c => c !== src);
    let idx = beforeId ? rest.findIndex(c => c.id === beforeId) : rest.length;
    if (idx < 0) idx = rest.length;
    rest.splice(idx, 0, src);
    if (rest.every((c, i) => c === categories[i])) return; // dropped where it already was
    categories = rest;
    render();
    await Promise.all(categories.map((c, i) => {
      if (c.order_index === i) return Promise.resolve();
      c.order_index = i;
      return updateCategory(c.id, { order_index: i });
    }));
  }

  async function loadAll() {
    const [cr, pr, tr] = await Promise.all([fetch("/api/categories"), fetch("/api/projects"), fetch("/api/tasks")]);
    categories = await cr.json();
    projects = await pr.json();
    tasks = await tr.json();
    render();
  }

  async function toggleTask(id, done) {
    const t = tasks.find(x => x.id === id);
    if (t) t.done = done;
    render();
    await fetch(`/api/tasks/${encodeURIComponent(id)}`, {
      method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ done })
    });
  }

  async function deleteTask(id) {
    tasks = tasks.filter(x => x.id !== id);
    render();
    await fetch(`/api/tasks/${encodeURIComponent(id)}`, { method: "DELETE" });
  }

  async function addTask(projectId, title) {
    const res = await fetch("/api/tasks", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ project_id: projectId, title })
    });
    const created = await res.json();
    tasks.push(created);
    render();
  }

  async function updateProject(id, patch) {
    await fetch(`/api/projects/${encodeURIComponent(id)}`, {
      method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(patch)
    });
  }

  async function deleteProject(id) {
    projects = projects.filter(p => p.id !== id);
    tasks = tasks.filter(t => t.project_id !== id);
    render();
    await fetch(`/api/projects/${encodeURIComponent(id)}`, { method: "DELETE" });
  }

  async function reorderProjects(srcId, targetId) {
    const srcProj = projects.find(x => x.id === srcId);
    const tgtProj = projects.find(x => x.id === targetId);
    if (!srcProj || !tgtProj || srcId === targetId) return;

    const srcIdx = projects.indexOf(srcProj);
    const tgtIdx = projects.indexOf(tgtProj);
    const changingCategory = (srcProj.category_id || null) !== (tgtProj.category_id || null);
    if (changingCategory) srcProj.category_id = tgtProj.category_id || null;

    projects.splice(srcIdx, 1);
    // moving forward lands after the target, moving back lands before it; without
    // this, dropping a card on its right-hand neighbour did nothing
    const newTgtIdx = projects.indexOf(tgtProj) + (srcIdx < tgtIdx ? 1 : 0);
    projects.splice(newTgtIdx, 0, srcProj);
    render();

    const writes = projects.map((proj, i) => {
      const patch = {};
      if (proj.order_index !== i) { proj.order_index = i; patch.order_index = i; }
      if (proj === srcProj && changingCategory) patch.category_id = srcProj.category_id;
      return Object.keys(patch).length ? updateProject(proj.id, patch) : Promise.resolve();
    });
    await Promise.all(writes);
  }

  async function moveProjectToCategory(srcId, categoryId) {
    const srcProj = projects.find(x => x.id === srcId);
    if (!srcProj) return;
    const normalized = categoryId || null;
    if ((srcProj.category_id || null) === normalized) return; // dropped back into its own section

    srcProj.category_id = normalized;
    projects = projects.filter(p => p !== srcProj);
    projects.push(srcProj);
    render();

    const writes = projects.map((proj, i) => {
      const patch = {};
      if (proj.order_index !== i) { proj.order_index = i; patch.order_index = i; }
      if (proj === srcProj) patch.category_id = normalized;
      return Object.keys(patch).length ? updateProject(proj.id, patch) : Promise.resolve();
    });
    await Promise.all(writes);
  }

  async function createProject(name, tag, color, categoryId) {
    const res = await fetch("/api/projects", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, tag, color, category_id: categoryId || null })
    });
    const created = await res.json();
    projects.push(created);
    expandedIds.add(created.id);
    saveExpanded();
    render();
  }

  async function createCategory(name) {
    const res = await fetch("/api/categories", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name })
    });
    const created = await res.json();
    categories.push(created);
    render();
  }

  async function updateCategory(id, patch) {
    await fetch(`/api/categories/${encodeURIComponent(id)}`, {
      method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(patch)
    });
  }

  async function deleteCategory(id) {
    categories = categories.filter(c => c.id !== id);
    projects.forEach(p => { if (p.category_id === id) p.category_id = null; });
    render();
    await fetch(`/api/categories/${encodeURIComponent(id)}`, { method: "DELETE" });
  }

  const newCategoryFormTemplate = document.getElementById("newCategoryFormTemplate");
  const newCategoryHost = document.getElementById("newCategoryHost");
  const newCategoryBtn = document.getElementById("newCategoryBtn");

  function openNewCategoryForm() {
    const existing = newCategoryHost.querySelector("form");
    if (existing) { existing.querySelector(".ncName").focus(); return; }

    const node = newCategoryFormTemplate.content.cloneNode(true);
    const form = node.querySelector("form");
    node.querySelector(".ncName").placeholder = t("newCategoryPlaceholder");
    node.querySelector("button[type=submit]").textContent = t("createCategory");
    newCategoryBtn.style.display = "none";
    newCategoryHost.appendChild(node);
    const input = newCategoryHost.querySelector(".ncName");
    input.focus();

    const close = () => {
      const f = newCategoryHost.querySelector("form");
      if (f) f.remove();
      newCategoryBtn.style.display = "";
    };
    form.addEventListener("submit", e => {
      e.preventDefault();
      const name = input.value.trim();
      if (!name) return;
      createCategory(name);
      close();
    });
    input.addEventListener("keydown", e => { if (e.key === "Escape") close(); });
  }
  newCategoryBtn.addEventListener("click", openNewCategoryForm);

  loadAll();
})();
</script>
</body>
